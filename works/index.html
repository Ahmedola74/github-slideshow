<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Works — Ahmed Adel</title>
    <meta
      name="description"
      content="Explore the complete body of work by Ahmed Adel: branding, UI/UX products, social media systems, motion, and presentation design."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <script type="module" src="../assets/js/works.js" defer></script>
  </head>
  <body data-base-path="..">
    <header class="navbar">
      <div class="navbar-inner">
        <a href="../" class="nav-brand" aria-label="Ahmed Adel home"><strong>Ahmed Adel</strong></a>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <nav class="nav-links" aria-label="Primary">
          <a href="../" data-link="home">Home</a>
          <a href="./" data-link="works">Works</a>
          <a href="../contact/" data-link="contact">Contact</a>
        </nav>
      </div>
    </header>

    <main class="max-width" style="margin-top: 8rem; padding-bottom: 6rem;">
      <header class="section-heading">
        <div>
          <h1 style="margin-bottom: 0.5rem;">Works hub</h1>
          <p class="text-muted">
            Filter by discipline, client, or year. Every project is editable in the dashboard and propagates across the site automatically.
          </p>
        </div>
      </header>

      <section class="filters">
        <label>
          <span class="text-muted">Category</span>
          <select data-filter-section></select>
        </label>
        <label>
          <span class="text-muted">Client</span>
          <select data-filter-client></select>
        </label>
        <label>
          <span class="text-muted">Year</span>
          <select data-filter-year></select>
        </label>
        <label>
          <span class="text-muted">Search</span>
          <input type="search" placeholder="Search by project, tag, or client" data-filter-search />
        </label>
      </section>

      <section class="works-grid" data-works-grid aria-live="polite"></section>
    </main>

    <footer>
      <div class="max-width footer-grid">
        <p>© <span id="current-year"></span> Ahmed Adel.</p>
        <div class="socials">
          <a href="https://behance.net/ahmedadel4" target="_blank" rel="noopener">Behance</a>
          <a href="https://www.linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
          <a href="../admin/">Admin</a>
        </div>
      </div>
    </footer>
    <script>
      document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
